<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - COS</title>
  </head>
  <body>
    <div id="kakaocallback">
      <span> 로그인 처리 중... </span>
    </div>

    <script
      src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.5/kakao.min.js"
      integrity="sha384-dok87au0gKqJdxs7msEdBPNnKSRT+/mhTVzq+qOhcL464zXwvcrpjeWvyj1kCdq6"
      crossorigin="anonymous"
    ></script>
    <script>
      // SDK 초기화
      Kakao.init("767a22495c7396d75b6be80f52a05963");
      console.log("Kakao SDK 초기화 여부:", Kakao.isInitialized());

      const callbackUi = document.querySelector("#kakaocallback > span");
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get("code");

      if (!code) {
        console.error("인가코드 없음");
      } else {
        // access_token REST API로 토큰 요청
        fetch("https://kauth.kakao.com/oauth/token", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
          },
          body: new URLSearchParams({
            grant_type: "authorization_code",
            client_id: "767a22495c7396d75b6be80f52a05963",
            redirect_uri: "http://127.0.0.1:5500/callback.html",
            code: code,
          }),
        })
          .then((res) => res.json())
          .then((data) => {
            console.log("토큰 정보:", data);
            const accessToken = data.access_token;

            // JS SDK 수동으로 토큰 세팅
            Kakao.Auth.setAccessToken(accessToken);

            // JS SDK 사용자 정보 요청
            return Kakao.API.request({
              url: "/v2/user/me",
            });
          })
          .then((res) => {
            console.log("사용자 정보:", res);
            callbackUi.textContent = `${res.kakao_account.profile.nickname}님 환영합니다!`;
            // 리디렉션
            // setTimeout(() => {
            //   location.href = "index.html";
            // }, 1000);
          })
          .catch((err) => {
            console.error("토큰 요청 실패:", err);
          });
      }
    </script>
  </body>
</html>
